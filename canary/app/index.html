<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canary App</title>
    <style>
        /* 1. Dark Theme Base */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Courier New', Courier, monospace; /* Monospace for terminal look */
            background-color: #444; /* Very dark grey */
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. Terminal Card styling */
        .terminal-card {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: left; /* Aligned left like a console */
            min-width: 320px;
            border: 1px solid #444;
            border-top: 4px solid #FFD700; /* Gold/Yellow for Canary */
            position: relative;
        }

        /* 3. Typography & Accents */
        h1 {
            color: #FFD700; /* Canary Yellow */
            margin: 0 0 20px 0;
            font-size: 1.8rem;
            letter-spacing: -1px;
        }

        .status-line {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .highlight {
            color: #4CAF50; /* Green for "Running" status */
        }

        .tag {
            display: inline-block;
            background: #FFD700;
            color: #1a1a1a;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 4px;
            margin-top: 10px;
        }

        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #e0e0e0;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <h1>> Kubernetes_App</h1>
        
        <div class="status-line">
            <span>Status:</span> <span class="highlight">Active</span>
        </div>
        <div class="status-line">
            <span>Release:</span> <span>Canary Build</span>
        </div>
        <div class="status-line">
            <span>Ver:</span> <span>1.0.0</span>
        </div>

        <div class="tag">WARNING: TEST ENV</div>
        <span class="cursor"></span>
    </div>

</body>
</html>
