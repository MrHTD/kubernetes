<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable App</title>
    <style>
        /* 1. Dark Theme Base */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #222; /* Slightly darker for better contrast */
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. Terminal Card styling */
        .terminal-card {
            background: #fff;
            padding: 40px;
            border-radius: 4px; /* Sharper corners for terminal feel */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: left;
            min-width: 350px;
            border: 1px solid #444;
            border-top: 6px solid royalblue; /* Thicker accent */
            position: relative;
        }

        /* 3. Typography & Accents */
        h1 {
            color: royalblue;
            margin: 0 0 20px 0;
            font-size: 1.8rem;
            letter-spacing: -1px;
            border-bottom: 2px dashed #ddd; /* Divider line */
            padding-bottom: 10px;
        }

        .status-line {
            margin-bottom: 15px;
            font-size: 1rem;
            display: flex;
            justify-content: space-between; /* Spreads text to edges */
        }

        .highlight {
            color: royalblue;
            font-weight: bold;
        }

        /* New Traffic Bar Styling */
        .traffic-section {
            margin-top: 25px;
            padding: 15px;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            font-size: 0.9rem;
        }

        .ascii-bar {
            color: royalblue;
            font-weight: bold;
        }

        .tag {
            display: inline-block;
            background: #ff9800;
            color: #fff;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 2px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #333;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <h1>> Kubernetes_App</h1>
        
        <div class="status-line">
            <span>Status:</span> <span class="highlight">Active</span>
        </div>
        <div class="status-line">
            <span>Release:</span> <span>Stable Build</span>
        </div>
        <div class="status-line">
            <span>Ver:</span> <span>1.0.0</span>
        </div>

        <div class="traffic-section">
            <div>NETWORK_ALLOCATION:</div>
            <br>
            <div class="ascii-bar">[██████████░░] 80%</div>
        </div>

        <div class="tag">WARNING: TEST ENV</div>
        <span class="cursor"></span>
    </div>

</body>
</html>
