apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  labels:
    app: blue-green-app
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blue-green-app
      version: blue
  template:
    metadata:
      labels:
        app: blue-green-app
        version: blue
    spec:
      containers:
        - name: blue-green-app
          image: mughis01/blue-green-app:blue
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 1
