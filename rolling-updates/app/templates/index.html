<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Rolling Update Dashboard</title>
    <style>
        /* Base Styles */
        body, html {
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 20px;
        }

        .status-card {
            background: white;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #dcdcdc;
            transition: all 0.5s ease;
        }

        .card-header {
            padding: 1.5rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- DYNAMIC THEMES --- */
        
        /* VERSION 1 (Green) */
        .theme-v1 .card-header { background-color: #2ecc71; }
        .theme-v1 .dot { background-color: #2ecc71; }
        .theme-v1 .status-indicator { color: #2ecc71; background: #e8f5e9; }

        /* VERSION 2 (Purple) */
        .theme-v2 .card-header { background-color: #9b59b6; }
        .theme-v2 .dot { background-color: #9b59b6; }
        .theme-v2 .status-indicator { color: #9b59b6; background: #f5eef8; }

        /* Terminating Pod (Red) */
        .theme-terminating .card-header { background-color: #e74c3c; }
        .theme-terminating .status-indicator { color: #e74c3c; background: #fadbd8; }

        .card-body { padding: 2rem; }
        .header-title { margin: 0; font-size: 1rem; font-weight: 600; }
        .label { font-size: 0.85rem; color: #7f8c8d; font-weight: bold; display: block; margin-bottom: 0.5rem; }
        .value { font-size: 1.2rem; font-weight: 700; color: #2c3e50; word-break: break-all; }
        .info-row { margin-bottom: 1.5rem; }
        
        .status-indicator {
            display: inline-flex; align-items: center; font-size: 0.9rem; font-weight: 500;
            padding: 0.5rem 1rem; border-radius: 20px;
        }
        .dot {
            height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="pod-container" style="display:contents;"></div>

    <script>
        async function fetchPods() {
            try {
                const response = await fetch('/api/pods');
                const pods = await response.json();
                
                const container = document.getElementById('pod-container');
                container.innerHTML = ''; // Clear current cards

                pods.forEach(pod => {
                    // Determine theme based on Version
                    let themeClass = 'theme-v1';
                    if (pod.version === 'v2') themeClass = 'theme-v2';
                    if (pod.status === 'Terminating') themeClass = 'theme-terminating';

                    const html = `
                    <div class="status-card ${themeClass}">
                        <div class="card-header">
                            <h2 class="header-title">${pod.name}</h2>
                        </div>
                        <div class="card-body">
                            <div class="info-row">
                                <span class="label">Status</span>
                                <div class="value">${pod.status}</div>
                            </div>
                            <div class="info-row">
                                <span class="label">Image Version</span>
                                <div class="value">${pod.image}</div>
                            </div>
                            <div class="status-indicator">
                                <span class="dot"></span> ${pod.version.toUpperCase()}
                            </div>
                        </div>
                    </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                console.error('Error fetching pods:', error);
            }
        }

        // Refresh every 2 seconds
        setInterval(fetchPods, 2000);
        fetchPods();
    </script>
</body>
</html>
