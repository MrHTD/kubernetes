---
# 1. Service Account (Identity for the pod)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-sa
  namespace: default

---
# 2. Role (Permission to list pods)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]

---
# 3. Binding (Give Identity the Permission)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-pods-global
subjects:
  - kind: ServiceAccount
    name: dashboard-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---
# 4. The Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-dashboard
  template:
    metadata:
      labels:
        app: k8s-dashboard
    spec:
      serviceAccountName: dashboard-sa # <--- ATTACH PERMISSIONS HERE
      containers:
        - name: dashboard
          # I have built this image for you based on the code above
          # You can use it directly, or build your own from the code above
          image: mughis01/k8s-dashboard:v1
          ports:
            - containerPort: 5000

---
# 5. Expose Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector:
    app: k8s-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30005
  type: NodePort # Or LoadBalancer
